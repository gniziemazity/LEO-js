<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>Randomizer</title>
		<link rel="stylesheet" href="./shared/styles.css" />
	</head>
	<body class="randomizer-view">
		<div class="neon-frame">
			<div class="randomizer-area" id="randomizerArea"></div>
		</div>

		<script src="./shared/themes/theme-runtime.js"></script>
		<script src="./shared/themes/dragonball.js"></script>
		<script src="./shared/randomizers/randomizer-runtime.js"></script>
		<script src="./shared/randomizers/shuffle.js"></script>
		<script src="./shared/float-window.js"></script>
		<script>
			const { ipcRenderer } = require("electron");

			const { unfade } = initFloatWindow({
				close: "close-randomizer-window",
				devtools: "open-randomizer-devtools",
				fade: true,
			});

			ipcRenderer.invoke("get-settings").then((s) => {
				if (s) initBackground(s.floatingTheme);
			});

			ipcRenderer.on(
				"set-randomizer",
				(event, { names, style, bgColor }) => {
					unfade();
					const area = document.getElementById("randomizerArea");
					setBackgroundColor(bgColor);
					runRandomizerStyle(style, area, names || [], (index) => {
						ipcRenderer.send("randomizer-done", index);
					});
				},
			);
		</script>
	</body>
</html>
