<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>Image</title>
		<link rel="stylesheet" href="./shared/styles.css" />
	</head>
	<body class="image-view">
		<div class="neon-frame">
			<button id="pinBtn">📌</button>
			<img id="imageDisplay" alt="Lesson image" />
			<div id="errorMsg">Image could not be loaded.</div>
		</div>

		<script src="./shared/themes/theme-runtime.js"></script>
		<script src="./shared/themes/dragonball.js"></script>
		<script src="./shared/floating-window-page.js"></script>
		<script>
			const { ipcRenderer } = require("electron");

			const { setPin } = initFloatWindow({
				close: "force-close-image-window",
				devtools: "open-image-devtools",
				pin: "pin-image-window",
			});

			ipcRenderer.invoke("get-settings").then((s) => {
				if (s)
					initBackground(
						s.floatingTheme,
						s.colors.imageColor,
						document.querySelector(".neon-frame"),
					);
			});

			document
				.getElementById("imageDisplay")
				.addEventListener("click", () => setPin(true));

			ipcRenderer.on("set-image", (event, { imagePath, shouldPin }) => {
				const img = document.getElementById("imageDisplay");
				const err = document.getElementById("errorMsg");
				err.style.display = "none";
				img.style.display = "none";

				img.onload = () => {
					img.style.display = "block";
					ipcRenderer.send("resize-image-window", {
						width: img.naturalWidth + 64,
						height: img.naturalHeight + 64,
					});
				};
				img.onerror = () => {
					img.style.display = "none";
					err.style.display = "block";
				};
				img.src = "file://" + imagePath;

				if (shouldPin) setPin(true);
			});
		</script>
	</body>
</html>
