<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<link rel="manifest" href="/manifest.json" />
		<title>LEO Remote</title>
		<link rel="icon" href="icon.ico" type="image/x-icon" />
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body class="mobile-view side-right">
		<div id="mobile-header">
			<div class="header-main-row">
				<button
					id="toggleBtn"
					class="interaction-btn btn-start"
					onclick="toggleActive()"
				>
					▶︎
				</button>
				<button
					id="autoPilotBtn"
					class="interaction-btn btn-auto"
					onclick="requestAutoPilot()"
					title="Auto-pilot (while auto-typing is on)"
					disabled
				>
					✈️
				</button>
				<div id="timerSection">
					<button
						id="timerStartBtn"
						class="timer-btn"
						onclick="startTimer()"
						title="Start Timer"
					>
						⏱️
					</button>
					<div id="timerControls" class="timer-controls">
						<button
							class="timer-btn"
							onclick="adjustTimer(-10)"
							title="-10 min"
						>
							–
						</button>
						<span
							id="timerDisplay"
							class="timer-display"
							onclick="stopTimer()"
							title="Click to stop"
						></span>
						<button
							class="timer-btn"
							onclick="adjustTimer(10)"
							title="+10 min"
						>
							+
						</button>
					</div>
				</div>
			</div>
			<div class="progress-track">
				<div class="progress-bar" id="progressBar"></div>
			</div>
		</div>

		<div id="lesson-container">
			<div class="empty-state">Connecting to LEO...</div>
		</div>

		<div id="touchpadOverlay" class="touchpad-overlay">
			<div id="touchpadEditKeys" class="touchpad-toolbar touchpad-edit-bar">
				<button
					class="mode-side-btn pad-bar-btn"
					onclick="remoteEditKey('copy')"
					title="Copy"
					aria-label="Copy"
				>
					<span class="side-btn-emoji">⧉</span>
				</button>
				<button
					class="mode-side-btn pad-bar-btn"
					onclick="remoteEditKey('paste')"
					title="Paste"
					aria-label="Paste"
				>
					<span class="side-btn-emoji">📋</span>
				</button>
				<button
					class="mode-side-btn pad-bar-btn"
					onclick="remoteEditKey('cut')"
					title="Cut"
					aria-label="Cut"
				>
					<span class="side-btn-emoji">✂️</span>
				</button>
				<button
					class="mode-side-btn pad-bar-btn"
					onclick="remoteEditKey('undo')"
					title="Undo"
					aria-label="Undo"
				>
					<span class="side-btn-emoji pad-glyph-ccw">↩️</span>
				</button>
				<button
					class="mode-side-btn pad-bar-btn"
					onclick="remoteEditKey('enter')"
					title="Enter"
					aria-label="Enter"
				>
					<span class="side-btn-emoji pad-glyph-ccw">⏎</span>
				</button>
				<button
					class="mode-side-btn pad-bar-btn"
					onclick="remoteEditKey('save')"
					title="Save"
					aria-label="Save"
				>
					<span class="side-btn-emoji">💾</span>
				</button>
			</div>
			<div id="touchpadStepKeys" class="touchpad-toolbar touchpad-step-bar">
				<button
					class="mode-side-btn pad-bar-btn"
					onclick="remoteStep('back')"
					title="Step back"
					aria-label="Step back"
				>
					<span class="side-btn-emoji">◀</span>
				</button>
				<button
					class="mode-side-btn pad-bar-btn"
					onclick="remoteStep('forward')"
					title="Step forward"
					aria-label="Step forward"
				>
					<span class="side-btn-emoji">▶</span>
				</button>
			</div>
		</div>

		<button
			id="overlayCloseBtn"
			class="mode-side-btn overlay-chrome-close"
			onclick="closeActiveOverlay()"
			title="Close"
			style="display: none"
		>
			<span class="side-btn-emoji">✕</span>
		</button>

		<div id="modeSideBtns" class="mode-side-btns">
			<button
				id="modeBtnMouse"
				class="mode-side-btn"
				onclick="setTouchpadMode('mouse')"
				title="Mouse"
			>
				<span class="side-btn-emoji">🖱️</span>
			</button>
			<button
				id="modeBtnKeyboard"
				class="mode-side-btn kb-disabled"
				onclick="setTouchpadMode('keyboard')"
				title="Keyboard"
			>
				<span class="side-btn-emoji">⌨️</span>
			</button>
			<button
				id="modeBtnPin"
				class="mode-side-btn"
				onclick="unpinWindows()"
				title="Unpin the pinned window"
			>
				<span class="side-btn-emoji">📌</span>
			</button>
		</div>

		<div id="interactionSideBtns" class="mode-side-btns">
			<button
				class="mode-side-btn mode-side-btn-question"
				onclick="handleInteractionBtn('student-question')"
				title="Student Question"
			>
				<span class="side-btn-emoji">❓</span>
			</button>
			<button
				class="mode-side-btn mode-side-btn-help"
				onclick="handleInteractionBtn('providing-help')"
				title="Providing Help"
			>
				<span class="side-btn-emoji">🤝</span>
			</button>
		</div>

		<div id="questionOverlay" class="overlay overlay-pad-ok">
			<div class="popup-modal">
				<div class="popup-title" id="qText"></div>
				<button
					class="popup-show-btn"
					id="qShowBtn"
					onclick="showQuestionToTeacher()"
				>
					Show
				</button>
				<div class="popup-student-grid" id="qGrid"></div>
				<div class="q-answered-row" id="qAnsweredRow">
					<div class="q-close-bar">
						<div class="q-close-bar-fill" id="qCloseBarFill"></div>
					</div>
				</div>
			</div>
		</div>

		<div id="interactionOverlay" class="overlay">
			<div class="popup-modal" id="iModal">
				<div class="popup-title" id="iTitle">Select student</div>
				<div class="i-question-row" id="iQuestionRow" style="display: none">
					<input
						type="text"
						class="i-question-input"
						id="iQuestionInput"
						placeholder="Type the question here..."
					/>
					<button
						class="i-mic-btn"
						id="iMicBtn"
						onclick="interactionMic()"
					>
						🎤
					</button>
				</div>
				<div class="popup-student-grid" id="iGrid"></div>
			</div>
		</div>

		<div id="moveToOverlay" class="overlay overlay-pad-ok">
			<div class="popup-modal" id="mtModal">
				<div class="popup-title popup-title-row">
					<span id="mtoTitle">Move to…</span>
					<span
						class="mt-modal-note"
						id="mtoNote"
						style="display: none"
					></span>
				</div>
				<div class="mt-modal-target" id="mtoTarget"></div>
				<div class="snippet-view mt-modal-snippet" id="mtoSnippet"></div>
				<div class="mt-modal-actions" id="mtoActions">
					<button
						class="mt-modal-confirm"
						id="mtoTypeName"
						onclick="moveToTypeName()"
					>
						Auto-type
					</button>
					<button
						class="mt-modal-confirm"
						id="mtoConfirm"
						onclick="closeMoveToOverlay()"
					>
						OK
					</button>
				</div>
			</div>
		</div>

		<div id="codeInsertOverlay" class="overlay overlay-pad-ok">
			<div class="popup-modal" id="ciModal">
				<div class="popup-title">Code snippet:</div>
				<div
					class="snippet-view mt-modal-snippet ci-modal-code"
					id="ciCode"
				></div>
				<div class="ci-modal-actions" id="ciActions">
					<button
						class="mt-modal-confirm ci-paste-btn"
						id="ciPaste"
						onclick="codeInsertPaste()"
					>
						Paste
					</button>
					<button
						class="mt-modal-confirm"
						id="ciConfirm"
						onclick="closeCodeInsertOverlay()"
					>
						OK
					</button>
				</div>
			</div>
		</div>

		<div id="noteOverlay" class="overlay overlay-pad-ok">
			<div class="popup-modal" id="ntModal">
				<div class="popup-title" id="ntTitle">Note:</div>
				<div class="mt-modal-note note-modal-text" id="ntText"></div>
				<div class="mt-modal-actions">
					<button class="mt-modal-confirm" onclick="closeNoteOverlay()">
						OK
					</button>
				</div>
			</div>
		</div>

		<div id="mediaOverlay" class="overlay overlay-pad-ok">
			<div class="popup-modal" id="mdModal">
				<div class="popup-title" id="mdTitle"></div>
				<div class="mt-modal-target media-modal-panel" id="mdName"></div>
				<div class="mt-modal-actions">
					<button
						class="mt-modal-confirm"
						id="mdPin"
						onclick="pinMediaWindow()"
						title="Pin this window"
					>
						📌
					</button>
					<button class="mt-modal-confirm" onclick="closeMediaOverlay()">
						OK
					</button>
				</div>
			</div>
		</div>

		<script src="code-text.js"></script>
		<script src="move-to-target.js"></script>
		<script src="blocks.js"></script>
		<script src="snippet-view.js"></script>
		<script src="interaction-view.js"></script>
		<script src="remote/connection.js"></script>
		<script src="remote/touchpad.js"></script>
		<script src="remote/timer.js"></script>
		<script src="remote/lesson.js"></script>
		<script src="remote/remote-overlay.js"></script>
		<script src="remote/question-overlay.js"></script>
		<script src="remote/interaction-overlay.js"></script>
		<script src="remote/move-to-overlay.js"></script>
		<script src="remote/code-insert-overlay.js"></script>
		<script src="remote/note-overlay.js"></script>
		<script src="remote/media-overlay.js"></script>
		<script src="remote/overlays.js"></script>
		<script src="remote/plugin.js"></script>

		<script>
			function handleMessage(message) {
				const { type, data } = message;
				switch (type) {
					case "state":
						updateAllState(data);
						break;
					case "lesson-data":
						updateLessonData(data);
						break;
					case "cursor":
						updateCursor(data);
						break;
					case "progress":
						updateProgress(data);
						break;
					case "settings":
						applySettings(data);
						break;
					case "active":
						updateActiveState(data.isActive);
						setSessionActive(data.isActive);
						break;
					case "auto-pilot":
						setAutoPilot(data.autoPilot);
						break;
					case "students":
						setStudents(data.students);
						break;
					case "question-started":
						showQuestionOverlay(
							data.question,
							data.students,
							data.bgColor,
							data.options,
						);
						break;
					case "question-shown":
						revealQuestionOverlay();
						break;
					case "question-ended":
						closeQuestionOverlayUI();
						break;
					case "randomizer-result":
						onRandomizerResult(data.index, data.name);
						break;
					case "open-interaction":
						handleInteractionBtn(data.interactionType);
						break;
					case "move-to-started":
						showMoveToOverlay(data);
						break;
					case "move-to-typing":
						moveToOverlay.setTyped(data);
						break;
					case "move-to-ended":
						closeMoveToOverlayUI();
						break;
					case "code-insert-started":
						showCodeInsertOverlay(data);
						break;
					case "code-insert-ended":
						closeCodeInsertOverlayUI();
						break;
					case "note-started":
						showNoteOverlay(data);
						break;
					case "note-ended":
						closeNoteOverlayUI();
						break;
					case "media-started":
						showMediaOverlay(data);
						break;
					case "media-ended":
						closeMediaOverlayUI();
						break;
					case "pinned-windows":
						setPinnedWindows(data);
						break;
					case "timer-tick":
						showTimerRunning(data.timeRemaining);
						break;
					case "timer-stopped":
						showTimerStopped();
						break;
				}
			}

			function updateAllState(state) {
				updateProgress(state);
				if (state.isActive !== undefined) {
					updateActiveState(state.isActive);
					setSessionActive(state.isActive);
				}
				setAutoPilot(state.autoPilot === true);
				if (state.settings) applySettings(state.settings);
				if (state.lessonData) updateLessonData(state.lessonData);
				if (state.currentStep !== undefined)
					updateCursor({ currentStep: state.currentStep });
				if (state.students) setStudents(state.students);
				if (state.activeQuestion)
					showQuestionOverlay(
						state.activeQuestion,
						state.students || [],
						state.activeQuestionBgColor,
						state.activeQuestionOptions,
					);
				if (state.activeQuestion && state.activeQuestionShown)
					revealQuestionOverlay();
				if (state.activeMoveTo) showMoveToOverlay(state.activeMoveTo);
				if (state.activeCodeInsert)
					showCodeInsertOverlay(state.activeCodeInsert);
				setPinnedWindows(state.pinnedWindows);
				if (state.activeNote) showNoteOverlay(state.activeNote);
				if (state.activeMedia) showMediaOverlay(state.activeMedia);
				if (state.timeRemaining != null)
					showTimerRunning(state.timeRemaining);
				else showTimerStopped();
			}

			setMessageHandler(handleMessage);
			initTouchpad();
			setTimeout(connect, 500);
		</script>
	</body>
</html>
